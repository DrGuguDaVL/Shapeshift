<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Polígonos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>

<div class="card">
    <h2>Gerador de Polígonos</h2>

    <div class="controls-grid">
        <div class="input-group">
            <label for="presetShape">Forma predefinida</label>
            <select id="presetShape">
                <option value="none">Polígono personalizado (usar lados)</option>
                <option value="square">Quadrado</option>
                <option value="rectangle">Retângulo</option>
                <option value="circle">Círculo</option>
                <option value="semicircle">Semicírculo</option>
                <option value="oval">Óvalo</option>
                <option value="parallelogram">Paralelogramo</option>
                <option value="trapezoid">Trapézio</option>
                <option value="triangle">Triângulo</option>
                <option value="star">Estrela (Modificável)</option>
                <option value="cross">Cruz</option>
                <option value="rhombus">Losango</option>
                <option value="diamond">Ouro / Diamante ♦</option>
                <option value="heart">Coração ♥</option>
                <option value="club">Clube ♣</option>
                <option value="spade">Espada ♠</option>
                <option value="drop">Gota de Água</option>
                <option value="kite">Pipa / Pipas</option>
                <option value="arrow">Seta</option>
                <option value="crescent">Crescente</option>
                <option value="foil">Folhado / Pétalas</option>
                <option value="pie">Torta (Percentual)</option>
                <option value="ring" selected>Anel (Percentual Modificável)</option>
            </select>
        </div>

        <div class="input-group hidden" id="triangleGroup">
            <label for="triangleType">Tipo de Triângulo</label>
            <select id="triangleType">
                <option value="equilateral">Equilátero</option>
                <option value="isosceles">Isósceles</option>
                <option value="right">Retângulo</option>
                <option value="scalene">Escaleno</option>
                <option value="obtuse">Obtusângulo</option>
            </select>
        </div>

        <div class="input-group hidden" id="trapezoidGroup">
            <label for="trapezoidType">Tipo de Trapézio</label>
            <select id="trapezoidType">
                <option value="isosceles">Isósceles</option>
                <option value="right">Retângulo</option>
                <option value="scalene">Escaleno</option>
            </select>
        </div>

        <div class="input-group hidden" id="foilGroup">
            <label for="foilPetals">Número de Pétalas</label>
            <input type="number" id="foilPetals" min="3" max="12" value="4">
        </div>

        <div class="input-group hidden" id="starGroup">
            <label for="starSpikes">Pontas da Estrela</label>
            <input type="number" id="starSpikes" min="3" max="20" value="5">
        </div>

        <div class="input-group hidden" id="pieGroup">
            <label for="piePercent">Preenchimento da Torta (%)</label>
            <input type="number" id="piePercent" min="1" max="100" value="75">
        </div>

        <div class="input-group" id="ringGroup">
            <label for="ringInnerPercent">Raio interno (% do tamanho)</label>
            <input type="number" id="ringInnerPercent" min="10" max="90" value="50">
        </div>

        <div class="input-group hidden" id="sidesGroup">
            <label for="numberInput">Número de lados</label>
            <input type="number" id="numberInput" min="1" max="100" placeholder="Exemplo 5">
        </div>

        <div class="input-group">
            <label for="angleInput">Ângulo (graus)</label>
            <input type="number" id="angleInput" value="0">
        </div>

        <div class="input-group">
            <label for="colorPicker">Escolha uma cor</label>
            <input type="color" id="colorPicker" value="#4287f5">
        </div>

        <div class="input-group full-width">
            <label for="colorText">Ou digite o nome de qualquer cor.</label>
            <input type="text" id="colorText" placeholder="rosa, azul-celeste, pervinca, esmeralda...">
        </div>
    </div>

    <button id="generateBtn">Gerar forma</button>

    <div class="stage">
        <svg id="stageSvg" viewBox="0 0 300 300">
            <path id="morphPath" fill="#4287f5" fill-rule="evenodd" d="" />
        </svg>
    </div>

    <div class="copy-section">
        <span class="copy-title">Copiar Código</span>
        <div class="copy-buttons">
            <button id="copyDPathBtn" class="copy-btn">Copiar Dados do Caminho (`d`)</button>
            <button id="copySvgBtn" class="copy-btn">Copiar Código SVG</button>
            <button id="copyCssBtn" class="copy-btn">Copiar CSS Clip-Path</button>
        </div>
    </div>
</div>

<div id="toast" class="toast hidden">Copiado para a área de transferência!</div>

<script src="script.js"></script>
</body>
</html>
